name: Deploy Shopwave

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.0.0"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          bun install
          bun run build
        env:
          VITE_API_BASE: "http://18.207.190.144:4000"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy frontend to S3
        run: |
          aws s3 sync ./frontend/dist s3://ibrahim-cloud-shop-frontend-2026 --delete
     -  name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: namespcae/backend-shopwave # اسم ريبو ECR عندك
          IMAGE_TAG: latest
        run: |
           docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG ./backend
           docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Force ECS Deployment
        run: |
          aws ecs update-service --cluster <cluster-name> --service <service-name> --force-new-deployment

      - name: Build backend Docker image
        working-directory: ./backend
        run: |
          docker build \
            --build-arg VITE_API_BASE=18.207.190.144 \
            -t namespcae/backend-shopwave .